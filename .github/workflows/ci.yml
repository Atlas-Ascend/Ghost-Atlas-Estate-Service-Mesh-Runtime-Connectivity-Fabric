name: build-truth

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  mesh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e '.[dev]'
      - name: Test mesh contracts
        run: pytest -q
      - name: Import runtime
        run: python -c "from app.main import ENGINE, app; print('MESH', app.title); print('REGISTRY', ENGINE.registry_url)"
      - name: Build production container
        run: docker build -t ghost-atlas-estate-service-mesh:${{ github.sha }} .
